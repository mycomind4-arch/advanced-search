name: UI checks
on:
  push:
    paths: ['ui/**','vercel.json']
  pull_request:
    paths: ['ui/**','vercel.json']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package.json
      - run: npm install
      - run: npm run build
