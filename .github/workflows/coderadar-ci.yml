name: CodeRadar checks
on:
  push:
    paths: ['coderadar/**']
  pull_request:
    paths: ['coderadar/**']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test coderadar/tests/*.test.mjs
